  # -------------------------------------------------------------------- eval ---

  - id: lianghsun/tw-PII-bench
    revision: 62bdad506803b15e1a4193f4493200ad431b1af7
    role: eval
    licence: apache-2.0
    languages: [zh-Hant]
    rows: 910
    approx_bytes: 2200000
    url: https://huggingface.co/datasets/lianghsun/tw-PII-bench
    notes: >
      THE PRIMARY CHINESE EVALUATION SET. Taiwan-specific Traditional Chinese,
      scenario-based (medical prescriptions, food-delivery complaints, immigration
      forms, customs declarations, labour and health insurance forms, LINE threads,
      Dcard posts, rental contracts, tax filings). 7,915 spans, all character offsets
      verified by slicing. 40 negatives. 8 in-schema categories matching
      openai/privacy-filter plus 11 Taiwan-specific OOD labels and 5 hard-negative
      subtypes. 545 spans carry an empty expected_model_label, which appears to mark
      spans the model is not expected to flag; decide how your scorer treats those.
      CAVEAT: 125 downloads and 0 likes. No paper. Labels are only as good as their
      generator, so hand-check a sample.
    label_style: "spans with {start, end, label, expected_model_label}"
    splits: [short (310), mid (300), long (300)]

  - id: wan9yu/pii-bench-zh
    revision: c350b94897af668517ff5de237d89f2ce2eaa6f0
    role: eval
    licence: apache-2.0
    languages: [zh-Hans]
    rows: 8000
    approx_bytes: 2700000
    url: https://huggingface.co/datasets/wan9yu/pii-bench-zh
    notes: >
      Simplified Chinese, mainland formats. 23,206 entities, all character offsets
      verified by slicing, matching the card's claim exactly. Two subsets: `formal`
      (5,000, registration forms, medical records, delivery orders, contracts) and
      `chat` (3,000, noisy instant messaging with emoji, informal register and
      zh/en code-switching). The chat subset is the valuable half.
      CAVEAT: 262 downloads, 0 likes, no paper.
    label_style: >
      entities with {text, type, start, end}. The key is `type`, not `label`.
      The eight types are person, phone, address, id_number, email, bank_card,
      passport, license_plate. The card claims real checksum validation for the
      identifier types, MOD 11-2 for the mainland ID and Luhn for bank cards.
      That claim was not independently checked.

