  - id: mks-logic/SPY
    role: eval
    licence: cc-by-4.0
    languages: [en]
    rows: 8688
    approx_bytes: 90000000
    url: https://huggingface.co/datasets/mks-logic/SPY
    notes: >
      One of the Privacy Filter's reported benchmarks. Synthetic legal questions (4,197)
      and medical consultations (4,491), stored with placeholders that the repo's SPY.py
      fills with Faker at load time. experiments/compare/benchmarks.py does not run that
      remote code: `benchmarks.py build-spy` fills a 1,500-row sample itself, one profile
      per row as SPY.py does, with Faker 40.40.0 and seed 13, into
      data/external/SPY/spy_filled_seed13.jsonl. Two deviations from SPY.py: ID_NUM uses
      only the generators that map to one of our types (ssn, credit card, IBAN, BBAN),
      and URLs count neither way, because most Faker URLs are shop and company sites.
      Fetched by its `external:` entry.

