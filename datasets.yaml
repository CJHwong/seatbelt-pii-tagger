excluded:

  - id: ai4privacy/pii-masking-400k
    licence: custom, academic and non-commercial only
    why: >
      VERIFIED by reading license.md. "Access to this dataset is granted exclusively
      for academic research and non-commercial purposes." Use beyond that "including
      any form of redistribution... or the creation and dissemination of derivative
      works" needs written permission. A trained model is a derivative work. The file
      also states the data is watermarked and that unauthorised use is traceable.
      This is why iiiorg/piiranha-v1 carries cc-by-nc-nd-4.0 in prose while its YAML
      says mit. The prose matches its training data.

  - id: ai4privacy/pii-masking-200k
    licence: custom, two-tier, corporate licence needed above 3 staff
    why: >
      Different licence from the 400k set. Free only for entities with up to 3 staff.
      Currently carries NO licence field at all in its YAML while the repo still holds
      the restrictive LICENSE file. Dropping the YAML tag does not drop the licence.

  - id: ai4privacy/pii-masking-300k
    licence: other, pointing at license.md
    why: >-
      YAML reads `license: other` with `license_name: license.md`, so a scanner flags nothing.
      Its English validation file is scored for local evaluation only, report-only, by
      experiments/compare/published.py. Fetch it with `fetch_data.py --only pii-masking-300k`.
      Local only: its licence needs written permission to share results, so the report leaves
      it out, and the evaluation skips it when the folder is absent.

  - id: Babelscape/multinerd
    licence: cc-by-nc-sa-4.0
    why: >-
      Non-commercial. Covers Chinese, which makes it tempting. Its en and zh test files
      are scored for local evaluation only, report-only, by published.py.

  - id: Babelscape/wikineural
