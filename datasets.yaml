  - id: openai/privacy-filter
    licence: apache-2.0
    why: >
      Not a dataset, listed here to record the decision. Usable as a model, but the
      release ships no conversion script and never names the checkpoint that was
      converted, so it cannot be rebuilt from published artifacts. Its decode default
      is hard BIOES constraints with six transition biases all set to 0.0.
