# Datasets for training and evaluating seatbelt-pii-tagger.
#
# Every entry was read from the source (the dataset card, the licence file, or a
# direct row count over the data). Where a card contradicts its own data, the note
# says so and the measured value wins.
#
# `rows` is the measured row count. `approx_bytes` is from the Hugging Face
# datasets-server and is an estimate; scripts/verify_data.py records the real size
# after download into data/INVENTORY.json.
#
# Licences: this file records what the source declares. See the `excluded` section
# for datasets that are commonly used but cannot be shipped.

data_root_default: data  # relative to the repo root

datasets:

  # ---------------------------------------------------------------- training ---

  - id: nvidia/Nemotron-PII
    revision: b70ffaf5ff39e079776134c5bf4381f00a9fd1ed
    role: train
    licence: cc-by-4.0
    languages: [en]
    rows: 200000
    approx_bytes: 307300000
    url: https://huggingface.co/datasets/nvidia/Nemotron-PII
    notes: >
      Synthetic, generated with NVIDIA NeMo Data Designer, persona-grounded in US
      Census distributions. Spans are injected during generation, so labels are
      exact. Card prose says "100,000 records (50k train / 50k test)"; the parquet
      holds 200,000 (100k train, 100k test). Card says "55+" entity types, the data
      has exactly 55, and "50+" domains, the data has 58. Card body states "This
      dataset is ready for commercial use."
    label_style: "flat snake_case spans with {start, end, label}"

  - id: ai4privacy/pii-masking-openpii-1.5m
    revision: a785eb528e28be2693c3718a27e066970de5dadb
    role: train
    licence: cc-by-4.0
    languages: [en, fr, de, es, it, nl, pt, zh, ja, ko, ar, hi, id, vi, th, ms, tl]
    rows: 1636375
    approx_bytes: 5000000000
    url: https://huggingface.co/datasets/ai4privacy/pii-masking-openpii-1.5m
    notes: >
      LICENCE NUANCE. The YAML frontmatter reads `license: other` with
      `license_name: cc-by-4.0`, and the repo has NO standalone LICENSE file. The
      grant exists only as README prose: "Permitted Use: Research, commercial use,
      redistribution, and modification, subject to attribution requirements under
      CC-BY-4.0." Copyright Ai Suisse SA, a different entity from Ai4Privacy.
      The intent is unambiguous but a legal review may want it in writing.
      This is one of the six datasets named in Desert Ant Redact's
      THIRD_PARTY_NOTICES.md.
      HOW IT WAS PRODUCED, the entire disclosure in the Ai4Privacy cards: the 400k
      set says only "This is synthetic data! Generated using proprietary algorithms
      - no privacy violations!", and the 500k set says only "created using Llama
      models (versions 3.1 and 3.3) as part of our pipeline at Ai4Privacy". No
      prompt, no pipeline stage, no source corpus, no generator detail. The stated
      framework is p5y, described as awareness, protection, quality assurance.
      Treat the generation method as undisclosed.
      DELIBERATELY NOT TAKEN: the sibling release `ai4privacy/pii-masking-openpii-1m`
      (1,428,143 rows, 23 languages, 4.6 GB). It is a separate release from this one,
      not a subset, but the two overlap heavily and this 1.5m set is the one Redact
      itself used. Taking both would have cost another 4.6 GB for near-duplicate
      content. Say the word if you want it; the fetcher takes it as an --only target
      once it is added to this manifest.
    label_style: 19 labels, span `privacy_mask` plus BIO `mbert_token_classes`

