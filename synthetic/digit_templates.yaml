  - "预订号 {booking} 已确认，请准时到达。"
  - "工单 {ticket} 已转交仓库处理，时间戳 {epoch}。"
  - "下载完成，共 {bytes} 字节，进程号 {pid}。"
  # 对照：同一行有证件号码与商业编号
  - "客户身份证号 {cn_id}，订单 {order} 已退款。"
  - "护照号码 {passport} 与预订 {booking} 的旅客一致。"
  - "请将退款转入账号 {bank_account}，发票号码为 {invoice}。"
  - "驾驶证号 {driver_license}，申请编号 {ticket}。"
  - "银行卡号 {card} 支付失败，交易流水号 {invoice}。"
