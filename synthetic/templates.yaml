  - "[老師|大家]辛苦了！[下週|本週]{other_date}的活動改到{landmark}，詳情見{public_url}。"
  - "透過仲介[介紹|推薦]看了{city}的房子，[優惠|折扣]後總價{amount}萬，仲介費另計。"
  - "收據：新台幣[壹|貳|參|伍]萬[伍|參|壹]仟元整，[訂金|租金]，{other_date}收訖。"
  - "敬祝 [平安喜樂|身體健康|事業順利]\n此致 敬禮\n{store} 敬上"
  - "[那位|隔壁的]太太說{store}今天有優惠，[阿姨|阿伯]們一早就去排隊了。"
  - "本[週|月]會員優惠：{product}[八折|買一送一]，活動至{other_date}止，詳洽{hotline}。"
  - "[謝謝|感謝]大家的介紹，{celebrity}的演唱會{other_date}在{landmark}，辛苦排隊的朋友加油！"

  # private URLs: profiles, blogs and personal domains
  - "[履歷|作品集]：{person}\nEmail：{email}\n個人網站：{personal_url}"
  - "我最近把[旅遊|育兒|理財]心得寫在部落格 {personal_url}，有興趣可以看看～"
  - "[面試官您好|您好]，附上我的 LinkedIn {personal_url}，再麻煩您參考。{person} 敬上"
  - "{person}的[FB|臉書]是 {personal_url}，你加他就知道了。"
  - "[接案|設計]聯絡：{person}　電話{mobile}　作品：{personal_url}"
  - "這是我的 GitHub Pages：{personal_url}，[專案|作品]都放在上面。"
heldout:
  # police and incident reports
  - "報案筆錄\n報案人：{person}，出生{dob}，身分證{national_id}，住{address}，電話{mobile}。\n報案人稱：{other_date}於{city}遭竊機車一輛，車牌{license_plate}。"
