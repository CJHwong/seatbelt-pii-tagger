# Source label -> training kind, per dataset. Read by scripts/build_training_set.py.
#
# The 18 types are listed in scripts/prep_lib.py (TYPES).
# Kinds:
#   a type name       one of: person email phone address date url account_number secret
#                     national_id passport license_plate username nhi_card company_id
#                     driver_license medical_license military_id household_no
#   person_part       name fragment, joined with adjacent fragments into person
#   address_strong    street-level part, joined with adjacent parts into address
#   address_weak      city, state, country, postcode: address only when joined to a strong part
#   ignore            masked out of the loss. A real identifier the 12 leave out, or a
#                     label this source cannot split (openpii DATE mixes birth dates in)
#   outside           trained as not-PII: public or non-identifying
# A label missing from its dataset's map stops the build.
#
# A dataset with `path:` needs no reader in build_training_set.py: the file is JSONL under the
# repo root, one {"text", "spans": [{start, end, label}], "script"} row per line. Mark it
# `private: true` when the file stays off the repo; the build then skips it, with a warning,
# on a machine without it. Your own private rows plug in the same way.

datasets:
  ai4privacy/pii-masking-openpii-1.5m:
    include: true
    languages: [en]  # 30 languages; the target is English and Chinese
    keep_chinese: true
    labels:
      GIVENNAME: person_part
      SURNAME: person_part
      DOCTORNAME: person_part
      EMAIL: email
      TELEPHONENUM: phone
      STREET: address_strong
      BUILDINGNUM: address_strong
      ZIPCODE: address_weak  # a bare postcode is not a private address
      CITY: address_weak
      COUNTRY: address_weak
      DATE: ignore  # no birth-date label here, so birth dates cannot be split out
      URL: url
      ACCOUNTNUM: account_number
      CREDITCARDNUMBER: account_number
      PASSWORD: secret
      IDCARDNUM: national_id
      SOCIALNUM: national_id
      PASSPORTNUM: passport
      USERNAME: username
      TAXNUM: ignore
      DRIVERLICENSENUM: driver_license
      IPV4: ignore
      MACADDRESS: ignore
      POLICYNUM: ignore
      TITLE: outside
      GENDER: outside
      SEX: outside
      AGE: outside
      TIME: outside
      ORGANISATION: outside
      AMOUNT: outside
      CURRENCY: outside
      BANKNAME: outside
      JOBTITLE: outside
      JOBTYPE: outside
      TIMEZONE: outside
      SALARY: outside
      WEIGHT: outside
      ALLERGIES: ignore
      MEDICATION: ignore
      AIRPORTCODE: outside
      HOSPITALNAME: outside

  Wismut/nym-pii-multilingual-data:
    include: true
    languages: null  # no language field; Latin-script rows are kept whatever the language
    keep_chinese: true
    labels:
      GIVEN_NAME: person_part
      SURNAME: person_part
      EMAIL: email
      PHONE: phone
      FAX_NUMBER: phone
      STREET_ADDRESS: address
      STREET_NAME: address_strong
      BUILDING_NUMBER: address_strong
      SECONDARY_ADDRESS: address_strong
      ZIP_CODE: address_weak  # a bare postcode is not a private address
      CITY: address_weak
      STATE: address_weak
      COUNTRY: address_weak
      DATE_OF_BIRTH: date
      DATE: outside  # birth dates carry their own label here, so the rest are not the date type
      TIME: outside
      URL: url
      ACCOUNT_NUMBER: account_number
      IBAN: account_number
      CREDIT_DEBIT_CARD: account_number
      ROUTING_NUMBER: account_number
      PASSWORD: secret
      API_KEY: secret
      PIN: secret
      CVV: secret
      SSN: national_id
      GOVERNMENT_ID: national_id
      PASSPORT: passport
